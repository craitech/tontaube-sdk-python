[project]
name = "tontaube"
version = "0.2.0"
description = "Python SDK for the Tontaube text-to-speech API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.24",
    "packaging>=21.0",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://tontaube.ai"
"API Reference" = "https://tontaube.ai/api-reference"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff",     # For Formatting
]